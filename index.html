const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(D.salt), iterations: D.it, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const zipped = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(D.iv)}, key, b64(D.ct));
  const stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
async function open_(pw, remember){
  const msg = document.getElementById("msg");
  msg.textContent = "여는 중…";
  try {
    const html = await unlock(pw);
    if (remember) try { localStorage.setItem("jjpw", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem("jjpw"); } catch (e2) {}
    msg.textContent = window.DecompressionStream ? "비밀번호가 맞지 않아요." : "브라우저가 오래돼 열 수 없어요 (iOS 16.4 이상 필요).";
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); open_(document.getElementById("pw").value, true); });
let saved = null; try { saved = localStorage.getItem("jjpw"); } catch (e) {}
